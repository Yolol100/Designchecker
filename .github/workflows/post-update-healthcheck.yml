name: Post-update Website Healthcheck

on:
  workflow_call:
    inputs:
      targets_json:
        description: 'JSON array with public domains/URLs or objects containing domain/url (max 150)'
        required: true
        type: string
      designchecker_ref:
        description: 'Immutable Designchecker commit SHA to execute'
        required: true
        type: string
      concurrency:
        description: 'Parallel browser checks (1-8)'
        required: false
        default: 4
        type: number
  pull_request:
    paths:
      - '.github/workflows/post-update-healthcheck.yml'
      - 'scripts/run-healthcheck.mjs'
      - 'src/tools/health.ts'
      - 'tests/healthcheck.test.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve Designchecker ref
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CALLER_REF: ${{ inputs.designchecker_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$CALLER_REF"
          fi
          if ! [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "designchecker_ref must be an immutable 40-character commit SHA" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout Designchecker capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yolol100/Designchecker
          ref: ${{ steps.source.outputs.ref }}
          path: designchecker
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: designchecker
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Validate and build Designchecker
        working-directory: designchecker
        run: |
          npm run check
          npm run build
      - name: Install Chromium
        working-directory: designchecker
        run: npx playwright install --with-deps chromium
      - name: Materialize run-scoped targets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALLER_TARGETS: ${{ inputs.targets_json }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const event = process.env.EVENT_NAME;
          const source = event === 'pull_request' ? '["https://example.com"]' : process.env.CALLER_TARGETS;
          if (!source) throw new Error('No healthcheck targets supplied.');
          let targets = JSON.parse(source);
          if (typeof targets === 'string') targets = JSON.parse(targets);
          if (!Array.isArray(targets) || targets.length < 1 || targets.length > 150) {
            throw new Error('targets must be a JSON array with 1-150 entries.');
          }
          fs.writeFileSync('designchecker/health-targets.json', JSON.stringify(targets));
          NODE
      - name: Run post-update healthcheck
        id: health
        shell: bash
        env:
          REQUESTED_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          concurrency="${REQUESTED_CONCURRENCY:-4}"
          set +e
          node designchecker/scripts/run-healthcheck.mjs \
            --targets-file designchecker/health-targets.json \
            --output "$GITHUB_WORKSPACE/results/healthcheck.json" \
            --screenshot-dir "$GITHUB_WORKSPACE/results/healthcheck-screenshots" \
            --concurrency "$concurrency"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish aggregate summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('results/healthcheck.json')) process.exit(0);
          const result = JSON.parse(fs.readFileSync('results/healthcheck.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Post-update healthcheck\n\n` +
            `Targets: ${result.targetCount}\n\n` +
            `PASS: ${result.summary.pass} | WARNING: ${result.summary.warning} | FAIL: ${result.summary.fail}\n`);
          NODE
      - name: Upload run-scoped health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-update-health-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 7
      - name: Propagate definitive health failure
        if: steps.health.outputs.exit_code != '0'
        run: exit "${{ steps.health.outputs.exit_code }}"
