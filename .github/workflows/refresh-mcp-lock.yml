name: Refresh MCP-free lockfile

on:
  push:
    branches:
      - fix/complete-repo-hardening-20260817
    paths:
      - '.github/workflows/refresh-mcp-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'Yolol100'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-repo-hardening-20260817
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Remove obsolete MCP packages from manifest and lockfile
        run: >-
          npm uninstall --package-lock-only --ignore-scripts --no-audit --no-fund
          @modelcontextprotocol/node @modelcontextprotocol/server
      - name: Verify root dependency contracts are MCP-free
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const name of ['@modelcontextprotocol/node', '@modelcontextprotocol/server']) {
            if (pkg.dependencies?.[name]) throw new Error(`${name} still declared in package.json`);
            if (lock.packages?.['']?.dependencies?.[name]) throw new Error(`${name} still declared in lockfile root`);
          }
          NODE
      - name: Commit regenerated dependency metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency metadata changes required.'
            exit 0
          fi
          git commit -m 'Remove obsolete MCP dependencies'
          git push origin HEAD:fix/complete-repo-hardening-20260817
