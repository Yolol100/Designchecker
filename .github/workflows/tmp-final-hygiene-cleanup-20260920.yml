name: Temporary final hygiene cleanup 2026-09-20
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete exact merged obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCHES: |
            audit-hygiene-cleanup|f59858989bf85270381dced419b616822799fc9c
            fix/phase9-design-runtime-cleanup-20260919|2b3f1db5af237958601869cce4de124ebb135994
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$actual" != "$expected" ]; then
              echo "SHA mismatch for $branch: expected=$expected actual=$actual" >&2
              exit 3
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted: $branch"
          done <<< "$EXPECTED_BRANCHES"
