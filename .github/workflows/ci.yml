name: ci

on:
  push:
    branches: ['main', 'agent/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npm test
