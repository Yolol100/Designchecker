name: ci

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'requests/command.json'
      - 'requests/inputs/**'
      - 'results/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Reject high-severity npm advisories
        run: npm audit --audit-level=high --no-fund
      - run: npm run config:check
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Validate active direct command runner
        run: node --check scripts/run-command.mjs
      - name: Validate post-update healthcheck runner
        run: node --check scripts/run-healthcheck.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
