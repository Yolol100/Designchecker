name: acd-wprocket-smoke-temp

on:
  push:
    branches:
      - 'runtime/acd-wprocket-final-qa-20260909'
    paths:
      - '.github/workflows/acd-wprocket-smoke-temp.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - name: Run primary-page smoke matrix
        run: node requests/acd-wprocket-smoke.mjs
