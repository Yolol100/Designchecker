name: vendor-specialist-packages

on:
  push:
    branches: ['main']
    paths:
      - '.webactueel/vendor-request.json'

permissions:
  contents: write

concurrency:
  group: vendor-specialist-packages
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy specialist repositories into monorepo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/webactueel-vendor packages/seo-technical packages/leadscanner packages/elementor-json packages/wordpress-audit packages/website-qa-legacy
          mkdir -p /tmp/webactueel-vendor packages

          clone_one() {
            repo="$1"
            dest="$2"
            git clone --quiet --depth 1 --branch main "https://github.com/Yolol100/${repo}.git" "/tmp/webactueel-vendor/${repo}"
            mkdir -p "packages/${dest}"
            cp -a "/tmp/webactueel-vendor/${repo}/." "packages/${dest}/"
            rm -rf "packages/${dest}/.git"
          }

          clone_one seochecker seo-technical
          clone_one Leadscanner leadscanner
          clone_one elementorjson elementor-json
          clone_one programmeren wordpress-audit
          clone_one Checklist website-qa-legacy

          # Remove mutable/request output state; keep code, tests, contracts and fixtures.
          rm -rf packages/leadscanner/scan-results
          rm -rf packages/website-qa-legacy/results packages/website-qa-legacy/requests

          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          items = [
              ('seo-technical', 'seochecker'),
              ('leadscanner', 'Leadscanner'),
              ('elementor-json', 'elementorjson'),
              ('wordpress-audit', 'programmeren'),
              ('website-qa-legacy', 'Checklist'),
          ]
          packages = []
          for package, repo in items:
              sha = subprocess.check_output(['git', '-C', f'/tmp/webactueel-vendor/{repo}', 'rev-parse', 'HEAD'], text=True).strip()
              packages.append({'package': package, 'source_repository': f'Yolol100/{repo}', 'source_commit': sha})
          payload = {
              'schema_version': 'webactueel-vendored-packages/1.0',
              'copied_at': datetime.now(timezone.utc).isoformat(),
              'runtime_rule': 'Designchecker packages are the runtime copies. Installed Skills and live Drive manifests remain policy/project truth.',
              'packages': packages,
          }
          with open('packages/VENDORED.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)
              f.write('\n')
          PY

      - name: Commit vendored packages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "webactueel-vendor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/
          if git diff --cached --quiet; then
            echo "No package changes"
            exit 0
          fi
          git commit -m "vendor specialist runtimes into monorepo"
          git push
