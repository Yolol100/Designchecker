name: drive-hash-audit

on:
  push:
    branches: ['main']
    paths:
      - '.webactueel/drive-hash-audit.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download selected Drive files without persisting source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/drive-hash
          node <<'NODE'
          const fs = require('fs');
          const req = JSON.parse(fs.readFileSync('.webactueel/drive-hash-audit.json','utf8'));
          for (const item of req.files) console.log(`${item.file_id}\t${item.name}\t${item.expected_size}`);
          NODE
          while IFS=$'\t' read -r id name size; do
            out="/tmp/drive-hash/$name"
            ok=0
            for url in \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              "https://drive.google.com/uc?export=download&id=${id}"; do
              if curl -L --fail --silent --show-error --max-time 30 "$url" -o "$out"; then
                actual=$(stat -c %s "$out")
                if [ "$actual" = "$size" ]; then ok=1; break; fi
              fi
            done
            if [ "$ok" != 1 ]; then
              echo "Could not obtain exact raw bytes for $name" >&2
              exit 2
            fi
          done < <(node -e "const r=require('./.webactueel/drive-hash-audit.json'); for(const x of r.files) console.log([x.file_id,x.name,x.expected_size].join('\\t'))")
      - name: Write checksum-only audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const req = JSON.parse(fs.readFileSync('.webactueel/drive-hash-audit.json','utf8'));
          const files = req.files.map(item => {
            const bytes = fs.readFileSync(`/tmp/drive-hash/${item.name}`);
            return {...item, actual_size: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex')};
          });
          fs.mkdirSync('audits',{recursive:true});
          fs.writeFileSync('audits/seo-drive-hashes.json', JSON.stringify({schema_version:'webactueel-drive-hash-audit/1.0', request_id:req.request_id, files}, null, 2)+'\n');
          NODE
      - name: Commit checksum audit
        shell: bash
        run: |
          git config user.name "webactueel-drive-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audits/seo-drive-hashes.json
          git commit -m "audit: SEO Drive raw hashes" || exit 0
          git push
