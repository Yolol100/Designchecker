name: webactueel-command

on:
  push:
    branches: ['main']
    paths:
      - 'requests/command.json'

permissions:
  contents: write

concurrency:
  group: webactueel-command-main
  cancel-in-progress: false

jobs:
  run-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run check
      - run: npm run build
      - name: Resolve command runtime
        id: runtime
        shell: bash
        run: |
          command=$(node -p "JSON.parse(require('fs').readFileSync('requests/command.json','utf8')).command")
          case "$command" in
            seo-technical|elementor-json|html|design-diff)
              echo "requires_browser=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "requires_browser=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Install Chromium when required
        if: steps.runtime.outputs.requires_browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run requested capability
        id: command
        shell: bash
        run: |
          set +e
          npm run command
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit evidence result
        shell: bash
        run: |
          git config user.name "webactueel-command-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result file to commit"
          else
            request_id=$(node -p "JSON.parse(require('fs').readFileSync('requests/command.json','utf8')).request_id")
            git commit -m "result: ${request_id}"
            git push
          fi
      - name: Propagate command failure
        if: steps.command.outputs.exit_code != '0'
        run: exit "${{ steps.command.outputs.exit_code }}"
