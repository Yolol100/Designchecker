name: Public Responsive QA

on:
  push:
    branches:
      - 'runtime/**'
    paths:
      - 'requests/public-responsive/*.json'

permissions:
  contents: read

concurrency:
  group: public-responsive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - name: Accept exactly one scoped runtime request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t REQUESTS < <(git show --pretty='' --name-only "${GITHUB_SHA}" | grep -E '^requests/public-responsive/[A-Za-z0-9._-]+\.json$' || true)
          FILE_COUNT="$(git show --pretty='' --name-only "${GITHUB_SHA}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$FILE_COUNT" != 1 ] || [ "${#REQUESTS[@]}" -ne 1 ]; then
            echo 'Expected one new request file, no other changed files.' >&2
            exit 1
          fi
          printf 'file=%s\n' "${REQUESTS[0]}" >> "$GITHUB_OUTPUT"
      - name: Install locked browser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Validate syntax and URL scope
        run: |
          node --check scripts/public-responsive-qa.mjs
          node scripts/public-responsive-qa.mjs "${{ steps.request.outputs.file }}" --validate-only
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public, GET/HEAD-only responsive checks
        run: node scripts/public-responsive-qa.mjs "${{ steps.request.outputs.file }}"
      - name: Upload ephemeral public-site evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-responsive-${{ github.run_id }}
          path: results/public-responsive/
          if-no-files-found: warn
          retention-days: 1
