name: acd-wprocket-final-qa-temp

on:
  push:
    branches:
      - 'runtime/acd-wprocket-final-qa-20260909'
    paths:
      - '.github/workflows/acd-wprocket-final-qa-temp.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Static repository checks
        run: |
          npm run check
          npm run build
          npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke check
        run: npm run smoke
      - name: Run two stable QA rounds
        run: node requests/acd-wprocket-qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: acd-wprocket-final-qa
          path: results/acd-wprocket-final-qa-20260909/
          if-no-files-found: error
          retention-days: 7
