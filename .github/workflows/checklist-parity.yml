name: Checklist migration parity

on:
  push:
    branches: ['migration/checklist-parity-20260909']
    paths:
      - 'legacy/checklist/**'
      - '.github/workflows/run-website-qa.yml'
      - '.github/workflows/finalize-website-qa.yml'
      - '.github/workflows/checklist-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify frozen source provenance
        run: test "$(cat legacy/checklist/UPSTREAM-COMMIT)" = "25bf9fd8ccefdd06cb4e7adf36e3ab332c76b854"
      - name: Install exact frozen dependencies
        run: npm ci --prefix legacy/checklist --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: node legacy/checklist/node_modules/playwright/cli.js install --with-deps chromium
      - name: Syntax and contract tests
        run: |
          npm run --prefix legacy/checklist check
          npm test --prefix legacy/checklist
      - name: Run frozen public-test fixture from Designchecker root
        env:
          CHECKLIST_PERSIST_BROWSER_ARTIFACTS: "0"
        run: node legacy/checklist/src/run.js legacy/checklist/test/fixtures/request.json
      - name: Validate raw result
        run: node legacy/checklist/src/validate-result.js results/latest.json
      - name: Build formal Evidence Manifest
        run: node legacy/checklist/src/finalize.js legacy/checklist/test/fixtures/policy.json results/formal-ci.json
      - name: Validate formal Evidence Manifest
        run: |
          node legacy/checklist/src/validate-formal.js results/formal-ci.json
          node legacy/checklist/src/validate-formal-hardening.js results/formal-ci.json
      - name: Upload parity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checklist-migration-parity
          path: |
            results/latest.json
            results/formal-ci.json
          if-no-files-found: error
          retention-days: 14
