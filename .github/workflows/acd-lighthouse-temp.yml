name: acd-lighthouse-temp

on:
  push:
    branches: ['runtime/acd-lighthouse-20260909']
    paths:
      - '.github/workflows/acd-lighthouse-temp.yml'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run Lighthouse
        run: |
          mkdir -p results
          WEBACTUEEL_EVIDENCE_OWNER=website-qa-checklist WEBACTUEEL_EVIDENCE_TOOL=performance_lighthouse node dist/src/cli.js performance 'https://acdcleaning.concept-webactueel-7.com/' > results/lighthouse.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: acd-lighthouse
          path: results/lighthouse.json
          if-no-files-found: error
          retention-days: 7
