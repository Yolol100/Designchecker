name: Bootstrap dependency lock

on:
  push:
    branches:
      - webactueel/audit-hardening-2026-08-16
    paths:
      - '.github/workflows/bootstrap-lock.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  bootstrap-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Generate deterministic lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from generated lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate build and tests
        run: |
          npm run check
          npm run build
          npm test

      - name: Commit lockfile to audit branch
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already stable.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Add reproducible npm lockfile [skip ci]'
          git push origin HEAD:webactueel/audit-hardening-2026-08-16
