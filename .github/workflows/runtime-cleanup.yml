name: Cleanup Designchecker runtime branch

on:
  workflow_run:
    workflows: ["webactueel-command"]
    types: [completed]

permissions:
  contents: write

jobs:
  cleanup-runtime-branch:
    if: ${{ startsWith(github.event.workflow_run.head_branch, 'runtime/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Delete temporary runtime branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          case "$RUNTIME_BRANCH" in
            runtime/*) ;;
            *) echo 'Unexpected runtime branch' >&2; exit 2 ;;
          esac
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$RUNTIME_BRANCH"
